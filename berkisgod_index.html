<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berk is God</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Press Start 2P', cursive;
            background-color: #121212;
            color: #ff0000;
            text-align: center;
        }
        h1 {
            margin-top: 50px;
            font-size: 50px;
            text-transform: uppercase;
            animation: flicker 2s infinite;
        }
        p {
            font-size: 20px;
            color: #ff0000;
        }
        @keyframes flicker {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
        .neon {
            color: #ff0000;
            text-shadow: 0 0 5px #ff0000, 0 0 10px #ff0000, 0 0 20px #ff0000, 0 0 40px #ff0000;
        }
    </style>
</head>
<body>
    <h1 class="neon">Berk is God</h1>
    <p>Hakkında: Yarrağımı yiyin gençler</p>
</body>
</html>
